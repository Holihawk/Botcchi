[project]
name = "botcchi"
version = "0.1.0"
description = "Agent-native AI assistant — QQ (OneBot v11) and Web channels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "mcp>=1.9",
    "resvg-py>=0.3.3",
    "lunardate>=0.3.0",
    "cryptography>=49.0.0",
    "protobuf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "aiosqlite>=0.20",
]

[project.scripts]
botcchi = "botcchi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["botcchi"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "ASYNC", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["botcchi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
